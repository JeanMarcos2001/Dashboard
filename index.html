<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataLanding - Dashboard de Gestión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        /* REGLA DE DISEÑO: El tamaño mínimo de tipografía usable en toda la app es 8pt (11px). */
        body {
            font-family: 'Darker Grotesque', sans-serif;
            background-color: #f8fafc;
        }

        @keyframes slideFromRight1 {
            0% { transform: scale(0.99) translateX(30px); opacity: 0.85; filter: blur(2px); }
            100% { transform: scale(1) translateX(0); opacity: 1; filter: blur(0); }
        }
        @keyframes slideFromRight2 {
            0% { transform: scale(0.99) translateX(30px); opacity: 0.85; filter: blur(2px); }
            100% { transform: scale(1) translateX(0); opacity: 1; filter: blur(0); }
        }
        @keyframes slideFromLeft1 {
            0% { transform: scale(0.99) translateX(-30px); opacity: 0.85; filter: blur(2px); }
            100% { transform: scale(1) translateX(0); opacity: 1; filter: blur(0); }
        }
        @keyframes slideFromLeft2 {
            0% { transform: scale(0.99) translateX(-30px); opacity: 0.85; filter: blur(2px); }
            100% { transform: scale(1) translateX(0); opacity: 1; filter: blur(0); }
        }
        .animate-slide-right-1 {
            animation: slideFromRight1 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        .animate-slide-right-2 {
            animation: slideFromRight2 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        .animate-slide-left-1 {
            animation: slideFromLeft1 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        .animate-slide-left-2 {
            animation: slideFromLeft2 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* Ocultar barra de desplazamiento para el efecto de cinta */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
        }

        .gradient-green {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .btn-glow:hover {
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #10b981;
            border-radius: 10px;
        }
    </style>

{

</head>

</html>
