<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataLanding - Dashboard de Gestión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        /* REGLA DE DISEÑO: El tamaño mínimo de tipografía usable en toda la app es 8pt (11px). */
        body, input, select, textarea, button {
            font-family: 'Montserrat', sans-serif;
        }
        body {
            background-color: #f8fafc;
        }
        /* Estilo global de placeholders para hacerlos más delgados y menos intrusivos */
        input::placeholder, textarea::placeholder {
            font-weight: 400 !important;
            color: #94a3b8 !important; /* text-slate-400 */
            opacity: 0.75 !important;
        }
        /* Estilo global de comboboxes (select) para mostrar las opciones visibles en letra regular */
        select, select option {
            font-weight: 400 !important;
        }

        @keyframes slideFromRight1 {
            0% { transform: scale(0.99) translateX(30px); opacity: 0.85; filter: blur(2px); }
            100% { transform: scale(1) translateX(0); opacity: 1; filter: blur(0); }
        }
        @keyframes slideFromRight2 {
            0% { transform: scale(0.99) translateX(30px); opacity: 0.85; filter: blur(2px); }
            100% { transform: scale(1) translateX(0); opacity: 1; filter: blur(0); }
        }
        @keyframes slideFromLeft1 {
            0% { transform: scale(0.99) translateX(-30px); opacity: 0.85; filter: blur(2px); }
            100% { transform: scale(1) translateX(0); opacity: 1; filter: blur(0); }
        }
        @keyframes slideFromLeft2 {
            0% { transform: scale(0.99) translateX(-30px); opacity: 0.85; filter: blur(2px); }
            100% { transform: scale(1) translateX(0); opacity: 1; filter: blur(0); }
        }
        .animate-slide-right-1 {
            animation: slideFromRight1 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        .animate-slide-right-2 {
            animation: slideFromRight2 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        .animate-slide-left-1 {
            animation: slideFromLeft1 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        .animate-slide-left-2 {
            animation: slideFromLeft2 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* Ocultar barra de desplazamiento para el efecto de cinta */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
        }

        .gradient-green {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        /* Degradado de marca: al hacer hover se desplaza hacia el extremo oscuro */
        .gradient-brand {
            background-image: linear-gradient(120deg, #10b981 0%, #059669 35%, #047857 70%, #064e3b 100%);
            background-size: 260% 100%;
            background-position: 0% 50%;
            transition: background-position 0.6s ease, box-shadow 0.3s ease, transform 0.15s ease;
        }
        .gradient-brand:hover {
            background-position: 100% 50%;
        }

        /* Interruptor deslizable (login: mantener sesión) */
        .switch-5 {
            --size: 18px;
            position: relative;
            flex-shrink: 0;
            background: linear-gradient(90deg, #10b981, #047857);
            line-height: 0;
            perspective: 400px;
            font-size: var(--size);
        }
        .switch-5,
        .switch-5 input[type="checkbox"],
        .switch-5 label,
        .switch-5 label::before,
        .switch-5 label::after {
            appearance: none;
            display: inline-block;
            border-radius: var(--size);
            border: 0;
            transition: .35s ease-in-out;
            box-sizing: border-box;
            cursor: pointer;
        }
        .switch-5 label {
            width: calc(2.2 * var(--size));
            height: var(--size);
            background: #cbd5e1;
            overflow: hidden;
        }
        .switch-5 input[type="checkbox"] {
            position: absolute;
            z-index: 1;
            width: calc(.8 * var(--size));
            height: calc(.8 * var(--size));
            top: calc(.1 * var(--size));
            left: calc(.1 * var(--size));
            background: linear-gradient(45deg, #dedede, #ffffff);
            box-shadow: 0 6px 7px rgba(0, 0, 0, 0.3);
            outline: none;
            margin: 0;
        }
        .switch-5 input[type="checkbox"]:checked {
            left: calc(1.3 * var(--size));
        }
        .switch-5 input[type="checkbox"]:checked + label {
            background: transparent;
        }
        .switch-5 input[type="checkbox"]:focus-visible + label {
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.35);
        }
        .switch-5 label::before,
        .switch-5 label::after {
            content: "· ·";
            position: absolute;
            overflow: hidden;
            left: calc(.15 * var(--size));
            top: calc(.5 * var(--size));
            height: var(--size);
            letter-spacing: calc(-0.04 * var(--size));
            color: #94a3b8;
            font-family: "Times New Roman", serif;
            z-index: 2;
            font-size: calc(.6 * var(--size));
            border-radius: 0;
            transform-origin: 0 0 calc(-0.5 * var(--size));
            backface-visibility: hidden;
        }
        .switch-5 label::after {
            content: "●";
            top: calc(.65 * var(--size));
            left: calc(.2 * var(--size));
            height: calc(.1 * var(--size));
            width: calc(.35 * var(--size));
            font-size: calc(.2 * var(--size));
            transform-origin: 0 0 calc(-0.4 * var(--size));
        }
        .switch-5 input[type="checkbox"]:checked + label::before,
        .switch-5 input[type="checkbox"]:checked + label::after {
            left: calc(1.55 * var(--size));
            top: calc(.4 * var(--size));
            line-height: calc(.1 * var(--size));
            transform: rotateY(360deg);
        }
        .switch-5 input[type="checkbox"]:checked + label::after {
            height: calc(.16 * var(--size));
            top: calc(.55 * var(--size));
            left: calc(1.6 * var(--size));
            font-size: calc(.6 * var(--size));
            line-height: 0;
        }

        .btn-glow:hover {
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #10b981;
            border-radius: 10px;
        }
    </style>
